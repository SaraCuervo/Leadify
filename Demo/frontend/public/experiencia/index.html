<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏗️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encuentra tu próximo hogar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- SORA ES LA DE Leadify y Poppins la de las cuatro constructoras: los
         titulares salen de `--fuente-titulos`, que js/tema.js cambia segun el
         tenant (ver SUPERFICIE_Leadify). Se piden las dos en la MISMA peticion
         porque el <link> se resuelve antes de saber que marca se cargo — el
         tenant entra por `document.write` mas abajo— y una segunda hoja de
         estilos descubierta a mitad del arranque es un parpadeo de fuente
         garantizado. Sora pesa ~15 KB en woff2 y llega en paralelo. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Leaflet, para el mapa real de la primera pregunta (ver js/mapa.js).
         Va ANTES de css/styles.css para que las reglas propias puedan pisar
         las suyas sin pelear a base de !important.

         Es la segunda dependencia externa del quiz, después de las tipografías
         de arriba. Se eligió sobre Google Maps porque no pide API key visible
         en el navegador ni cuenta con facturación. Version FIJADA: un mapa que
         cambia solo bajo los pies no es una dependencia, es una sorpresa. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/styles.css?v=106" />
  </head>
  <body>
    <div id="root"></div>

    <!-- EL TENANT. Unico punto donde se decide de que constructora se viste la
         app: `?marca=<slug>` en la URL. Son las cuatro constructoras
         precargadas (amarilo, constructora-bolivar, colsubsidio, cusezar) y
         la plataforma abre la experiencia pasando el slug que acaba de
         generar.

         POR DEFECTO VA BOLIVAR, y no es indiferente: de las cuatro, solo
         Bolivar y Colsubsidio publican plantas de apartamento usables para la
         escena del quiz. Con Amarilo o Cusezar el recorrido funciona igual
         pero sin plano que armar.

         `document.write` A PROPOSITO, y no es descuido: es lo unico que inserta
         un script EN EL PUNTO DEL PARSER, asi que se ejecuta en orden y ANTES
         de los que ya estan escritos abajo. Con `appendChild` el orden se
         mantendria entre los inyectados pero no contra estos, y main.js
         arrancaria sin marca. OJO: si esto se mueve dentro de un
         DOMContentLoaded o se le pone `defer`, `document.write` BORRA el
         documento entero. -->
    <script>
      (function () {
        var m = /[?&]marca=([a-z0-9-]+)/.exec(location.search);
        var slug = (m && m[1]) || 'constructora-bolivar';
        window.GDF_TENANT = slug;
        // MODO EMBEBIDO (`?embed=1`). Hoy lo usa el modal de "¡Empezar mi
        // match!" de la landing de Leadify, que monta esta app en un iframe.
        // Se lee aqui y no en config.js porque viene de la URL, igual que la
        // marca, y las dos tienen que estar antes de que arranque main.js.
        //
        // Cambia DOS cosas y solo dos:
        //   1. Se entra directo a la escarapela: el clic en el boton ya fue la
        //      intencion, y el splash dentro de un modal es una puerta detras
        //      de otra. La escarapela SI se conserva — es donde se piden
        //      nombre y telefono, o sea el lead, que es a lo que va la landing.
        //   2. El CSS invierte las columnas para dejar la casa a la derecha.
        window.GDF_EMBED = /[?&]embed=1(?:&|$)/.test(location.search);
        // Los TRES archivos del tenant: identidad, catalogo y planos. Se
        // cargan siempre los tres (aunque alguno venga vacio) para que no haya
        // un 404 en consola ni un `undefined` a mitad del arranque.
        //
        // Antes eran cuatro: habia un `portada.js` con el clon de la portada de
        // Colsubsidio. La app ya no tiene portada — entra directa al splash.
        ['marca', 'proyectos', 'planos'].forEach(function (f) {
          document.write('<scr' + 'ipt src="tenants/' + slug + '/' + f + '.js?v=105"></scr' + 'ipt>');
        });
      })();
    </script>
    <!-- traduce la paleta de la marca a las custom properties del :root -->
    <script src="js/tema.js?v=105"></script>
    <script src="js/config.js?v=105"></script>
    <!-- Generado por tools/generar_mapa.py: las 20 localidades como anillos
         [lon, lat] para GeoJSON y el indice de 1.256 barrios del buscador.
         ANTES que data.js, que es quien arma la pregunta de ubicacion con
         ellos. -->
    <script src="js/mapa_bogota.js?v=105"></script>
    <!-- Tambien generado: el contorno de los 1.229 barrios, para que un clic
         en cualquier punto del mapa resuelva en cual cayo. NO es una capa que
         se dibuje —js/mapa.js lo usa como datos y solo pinta el elegido—, asi
         que puede cargarse aqui sin costarle nada al DOM. -->
    <script src="js/mapa_barrios.js?v=106"></script>
    <!-- Y el catalogo de sitios con nombre de Bogota (centros comerciales,
         parques, universidades...), para el buscador "se un lugar cerca" de la
         misma pregunta. Cada uno viaja ya resuelto a su localidad y sector, asi
         que el buscador responde sin red; lo que no este aqui lo completa el
         geocodificador en vivo (ver PHOTON_URL en js/main.js). -->
    <script src="js/mapa_lugares.js?v=106"></script>
    <script src="js/data.js?v=106"></script>
    <!-- La libreria del mapa y el modulo que la envuelve. `defer` no: el resto
         de este front se carga sincrono y js/mapa.js solo toca a Leaflet en
         tiempo de ejecucion, cuando main.js lo monta. Si la red falla, window.L
         no existe, montar() devuelve false y el quiz sigue completandose con el
         buscador de barrios. -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="js/mapa.js?v=106"></script>
    <script src="js/matching.js?v=105"></script>
    <!-- el plano que arma el quiz: cortes generados por tools/analizar_planos.py,
         normalización de espacios, sorteo del apartamento y cuánto se ve ya -->
    <script src="js/espacios.js?v=105"></script>
    <script src="js/planta.js?v=105"></script>
    <script src="js/scene.js?v=105"></script>
    <script src="js/recommender.js?v=105"></script>
    <script src="js/qualification.js?v=105"></script>
    <script src="js/simulador.js?v=105"></script>
    <!-- El fondo "AI Signal" del Leadify Motion System: red de nodos y pulso
         coral. Cuelga del <body> y no de #root, que se reconstruye entero en
         cada pantalla — ver la cabecera de senal.js. -->
    <script src="js/senal.js?v=105"></script>
    <!-- Paso 2 del contrato: dispara la llamada de Manuela vía api.py -->
    <script src="js/llamada.js?v=105"></script>
    <!-- el contrato del modelo de recomendacion (Leadify) -->
    <script src="js/iconos.js?v=105"></script>
    <script src="js/leadify.js?v=105"></script>
    <!-- La base de datos del formulario (Postgres en Supabase): guarda quien
         llena el formulario, que se le recomendo y si acabo agendando cita.
         Va antes de main.js, que es quien la usa. -->
    <script src="js/datos.js?v=1"></script>
    <script src="js/templates.js?v=106"></script>
    <script src="js/state.js?v=105"></script>
    <!-- 3D opcional del panel del plano: mejora progresiva sobre el 2D de
         recortes de arriba (js/planta.js), no un reemplazo. Se apaga solo si
         el equipo no tiene WebGL o es de gama baja (ver "soportado" en
         plano3d/index.js) y ahi el 2D sigue siendo el camino, sin cambiar
         nada. El orden importa: cada archivo cuelga funciones de
         window.GDF3D que el siguiente ya da por puestas. -->
    <script src="js/plano3d/vendor/gdf-three.bundle.js?v=1"></script>
    <script src="js/plano3d/perfil.js?v=1"></script>
    <script src="js/plano3d/zonificacion.js?v=1"></script>
    <script src="js/plano3d/muros.js?v=1"></script>
    <script src="js/plano3d/floorplan.js?v=1"></script>
    <script src="js/plano3d/materiales.js?v=1"></script>
    <script src="js/plano3d/geometria.js?v=1"></script>
    <script src="js/plano3d/muebles.js?v=1"></script>
    <script src="js/plano3d/escena.js?v=1"></script>
    <script src="js/plano3d/index.js?v=1"></script>
    <script src="js/main.js?v=106"></script>
  </body>
</html>
