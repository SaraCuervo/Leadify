# Verificación automática del proyecto.
#
# Corre en cada push y en cada pull request contra main y develop. Son dos
# trabajos independientes a propósito: si la documentación tiene un enlace
# roto, queremos saberlo aunque el motor esté bien, y al revés.
name: Verificación

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  motor:
    name: El motor responde
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Demo/backend/requirements.txt

      - name: Instalar dependencias del backend
        working-directory: Demo/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # La prueba de humo no mide la calidad de lo que recomienda —eso lo hacen
      # evaluar.py y los calibradores— sino que el recorrido no se rompió: que
      # los datos cargan, que responde 18 proyectos y que la respuesta cumple
      # el contrato que el front espera.
      - name: Prueba de humo del motor
        working-directory: Demo/backend
        run: python pruebas/prueba_humo.py

      # El catálogo etiquetado se versiona, así que tiene que corresponder al
      # código que lo genera: si alguien cambia los supuestos de crédito y no
      # lo regenera, nada falla, el motor solo recomienda con reglas viejas.
      #
      # Se regenera en un archivo aparte y se compara ignorando
      # `meta.generado_en`, que es la fecha de la corrida y cambia siempre.
      - name: El catálogo corresponde al código que lo genera
        run: python .github/scripts/verificar_catalogo.py

  documentacion:
    name: La documentación no tiene enlaces rotos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Revisar los enlaces de los .md
        run: python .github/scripts/verificar_enlaces.py
